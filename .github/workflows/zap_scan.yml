name: OWASP ZAP Scan

on:
  push:

jobs:
  zap_scan:
    runs-on: self-hosted

    steps:
      - name: Prepare Report Folder
        shell: powershell -ExecutionPolicy Bypass -Command "{0}"
        run: |
          New-Item -ItemType Directory -Force -Path "C:\zap-reports"
          Remove-Item "C:\zap-reports\zap-report.html" -ErrorAction SilentlyContinue

      - name: Test Target Access
        shell: powershell -ExecutionPolicy Bypass -Command "{0}"
        run: |
          docker run --rm curlimages/curl:latest http://host.docker.internal:8080/courier/

      - name: Run OWASP ZAP Docker Scan
        shell: powershell -ExecutionPolicy Bypass -Command "{0}"
        continue-on-error: true
        run: |
          docker run --rm `
            -v "C:\zap-reports:/zap/wrk:rw" `
            ghcr.io/zaproxy/zaproxy:stable `
            zap-baseline.py `
            -t http://host.docker.internal:8080/courier/ `
            -r zap-report.html `
            -I `
            -d

          echo "Docker exit code: $LASTEXITCODE"

      - name: Check Report Folder
        if: always()
        shell: powershell -ExecutionPolicy Bypass -Command "{0}"
        run: |
          dir C:\zap-reports

      - name: Upload ZAP Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-security-report
          path: C:\zap-reports\zap-report.html