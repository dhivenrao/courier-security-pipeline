<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Courier Management System</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,Tahoma,Geneva,Verdana,sans-serif;
}

body{
    background:#f5f7fb;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:500px;
    background:white;
    border-radius:12px;
    padding:45px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.12);
}

.icon{
    font-size:70px;
    margin-bottom:15px;
}

h1{
    color:#dc3545;
    margin-bottom:10px;
}

h2{
    color:#333;
    margin-bottom:20px;
}

p{
    color:#666;
    line-height:1.6;
    margin-bottom:30px;
}

a{
    display:inline-block;
    padding:12px 28px;
    background:#0d6efd;
    color:white;
    text-decoration:none;
    border-radius:6px;
    transition:.3s;
}

a:hover{
    background:#0b5ed7;
}
</style>

</head>

<body>

<div class="container">

<div class="icon">⚠️</div>

Please try again later or contact the system administrator if the problem persists.
</p>

</a>

</div>

</body>
</html>
